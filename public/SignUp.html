<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title> Sign Up </title>
    <link rel="stylesheet" href="SignUp.css">
</head>

<Body>
    <div class="blur-overlay"></div>

    <div class="card">

        <form id="signupForm">
            <legend>Sign Up </legend>
            <input id="name" name="username" placeholder="*username" required>
            <input id="email" name="email" required placeholder="*email">
            <input id="password" name="password" type="password" placeholder="*password" required>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="*confirmpassword">


            <button type="submit" id="myBtn" onClick="handleSignUp(event)">Sign Up</button>
        </form>

        <script>
            
            function handleSignUp(event) {
                console.log("Sign Up button clicked");

                event.preventDefault(); // prevent page refresh

                const Username = document.getElementById('name');
                const Email = document.getElementById('email');
                const Password = document.getElementById('password');
                const Confirm_Password = document.getElementById('confirm_password');

                if (Password.value !== Confirm_Password.value) {
                    alert("Password does not match");
                    return;
                }

                fetch('/signup', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: Username.value.trim(),
                        email: Email.value.trim(),
                        password: Password.value
                    })
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data.message === "User created successfully") {
                            alert("User created successfully");
                            window.location.href = "Home.html";
                        } else {
                            alert(data.message);
                        }
                    });
            }
        </script>

</Body>
