<!DOCTYPE html>

<head>
   <meta charset="UTF-8">
   <title> Home page</title>
   <link rel="stylesheet" href="HomeStyle.css">
</head>

<body>
   <div id="hamburger"> ☰ </div>


   <div class="sidenav" id="sideView">
      <a href="javascript:void(0)" class="closebtn" id="closeBtn" onclick="togglenav()">×</a>
     <a href="http://localhost:3000/Homepage.html"> Home</a>
      <a href="contactus.html"> contact us</a>
      <a href="aboutus.html"> About us </a>
      <a href="reservation.html"> pick up reservation </a>
      <a href=" products.html"> products </a>
   </div>

   <!-- Homepage for users to login or signup -->
   <div class="login">
      <nav class=loginNav>
         <a href="login.html"> Login </a>
         <a href="signup.html"> Sign Up </a>
      </nav>
   </div>

   <!-- Homeage image -->
   <div class="Homecard">
      <div class="ProductSearchHome">

         <button type="submit" id="shop" onclick="MovetoProd(event)"> ShopNow</button>
      </div>

   </div>
   <div class="featuredHeader">
      <img src="images/featured.png">
   </div>

   <div class="featured-wrapper">
      <button id="prev">◀</button>

      <div class="featured-viewport">
         <div id="featuredRow" class="featured-row"></div>
      </div>

      <button id="next">▶</button>
   </div>


   <script>

      function MovetoProd(event) {
         event.preventDefault();

         window.location.href = "products.html";;//send to products page

      }

      const row = document.getElementById("featuredRow")
      const menuBtn = document.getElementById("hamburger");
      const sideView = document.getElementById("sideView");
      const closeBtn = document.getElementById("closeBtn");
      let loading = false;
      let page = 1; //page nummber for features row


      menuBtn.addEventListener("click", () => {
         sideView.style.width = "250px";
      });

      closeBtn.addEventListener("click", () => {
         sideView.style.width = "0";
      });

      
      function loadFeatured() {
    if (loading) return;
    loading = true;

    fetch(`/featured?page=${page}`)
        .then(res => res.json())
        .then(products => {
            row.innerHTML = ""; // clear for next slide

            products.forEach(element => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <img src="${element.image}" alt="${element.name}">
                    <p>${element.name}</p>
                    <button>Add to cart</button>
                `;

                row.appendChild(card);
            });

            page++;
            loading = false;
        })
        .catch(err => {
            console.error("Featured load error:", err);
            loading = false;
        });
}

      loadFeatured();

   </script>

</body>
